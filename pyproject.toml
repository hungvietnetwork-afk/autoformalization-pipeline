[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afp"
version = "0.3.0"
description = "Batch autoformalization pipeline: natural-language math -> Lean 4, verified by Lean (INT4418 Big Data, group 5)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyarrow>=15", "pandas>=2", "duckdb>=1.0", "psutil>=5.9", "numpy>=1.26", "matplotlib>=3.8",
  "openpyxl>=3.1", "scikit-learn>=1.4", "zstandard>=0.22",
]

[project.optional-dependencies]
redis = ["redis>=5"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
